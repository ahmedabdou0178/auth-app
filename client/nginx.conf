# Serves the built SPA and proxies /api to the API container (same origin for the browser).
# In a deployment, TLS termination, HSTS, WAF and edge rate limits live in the load balancer /
# ingress in front of this server; the API keeps its own CORS and rate limits as defense in depth.

server_tokens off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # SPA shell: always revalidated, so a deploy is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # No trailing slash: /api and /api/... both go to the API unchanged.
    location /api {
        # Responses carry session material next to request-controlled data: never compress
        # them (BREACH-style compression side channel).
        gzip off;
        client_max_body_size 16k;

        # Resolve `api` through Docker's embedded DNS at request time (cached 10s). A literal
        # host in proxy_pass is resolved once at startup, so a recreated api container with a
        # new IP would get 502s until nginx restarted. Using a variable forces runtime lookup;
        # with no URI part, the original request URI is passed through unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://api:3000;

        # The client's Host header is not forwarded (Host is set to api:3000).
        proxy_pass $api_upstream;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
