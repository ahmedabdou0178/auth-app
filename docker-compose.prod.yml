# Production overlay, applied on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
# Runs the images CI publishes to GHCR. TLS is terminated by the load balancer / ingress in
# front of the web container; secrets come from the deploy environment (secret store).
services:
  mongo:
    # Not reachable from the host in production.
    ports: !reset []

  api:
    image: ghcr.io/${GHCR_OWNER:?required}/auth-app-api:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      COOKIE_SECURE: 'true'
      SWAGGER_ENABLED: 'false'
      # Trust only private-network hops (the load balancer and nginx), so the rate limits and
      # the lockout see the real client IP and a client can't fake it with X-Forwarded-For.
      TRUST_PROXY: loopback, linklocal, uniquelocal

  web:
    image: ghcr.io/${GHCR_OWNER:?required}/auth-app-web:${IMAGE_TAG:-latest}
    build: !reset null
    # Plain HTTP for the TLS load balancer in front of it. Bound to WEB_BIND, not to every
    # interface: Docker-published ports bypass host firewalls (ufw/iptables rules), so binding
    # to 0.0.0.0 would expose unencrypted HTTP publicly, around the load balancer's TLS and WAF.
    # Set WEB_BIND to the private address the load balancer connects to (default: this host
    # only, e.g. for a load balancer or reverse proxy running on the same machine).
    ports: !override
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080
