packages:
  - shared
  - server
  - client

# Exact versions in package.json; refuse packages whose `engines` don't match.
saveExact: true
engineStrict: true

# Supply chain (SPEC §9.5)
# Never resolve a version published less than 7 days ago (minutes).
minimumReleaseAge: 10080
# Exact versions only, each reviewed: security fixes needed before they are 7 days old.
minimumReleaseAgeExclude:
  # GHSA-mrwp-f3q8-3g9p (high), published 2026-10-25; fixes credentials following redirects.
  - follow-redirects@1.16.2
# Transitive dependencies may only come from the registry, never git/tarball URLs.
blockExoticSubdeps: true
# Refuse a version published with weaker provenance than an earlier one.
trustPolicy: no-downgrade
# Exact versions only, each reviewed: old release lines published before npm provenance
# existed, still required by maintained packages (not a takeover).
trustPolicyExclude:
  # semver 6 line, required by @babel/core (via jest/ts-jest)
  - semver@6.3.1
# Security fixes for transitive dependencies (`pnpm audit --prod`). Remove an entry once the
# direct dependency ships the fixed version itself.
overrides:
  # GHSA-q7qp-rjg7-q26m (high): DoS via a pending async fileFilter. @nestjs/platform-express
  # 12.2.0 pins 2.4.0; 12.3.x (which bumps it) is newer than minimumReleaseAge allows.
  multer: 2.5.0
  # GHSA-mrwp-f3q8-3g9p (high), via axios (^1.16.0). Only axios' Node HTTP adapter uses it,
  # never the browser bundle, but the patched version is pinned anyway.
  follow-redirects: 1.16.2

# Install scripts are blocked unless listed here; every entry is reviewed.
allowBuilds:
  # Install-time usage telemetry pulled in by swagger-ui-dist; never needed.
  '@scarf/scarf': false
  # Its script only runs node-gyp-build, which also runs at require() time and loads the
  # bundled glibc/musl prebuilds; no compile step is needed.
  argon2: false
  # Jest watch mode only; script just selects a prebuilt binary.
  '@parcel/watcher': false
  # Postinstall pre-downloads mongod; it is downloaded lazily on first use instead.
  mongodb-memory-server: false
  # napi-postinstall fallback; pnpm already installs the platform binary as an optional dep.
  unrs-resolver: false
  # OTLP exporters' dependency; postinstall only prints a CLI version notice.
  protobufjs: false
